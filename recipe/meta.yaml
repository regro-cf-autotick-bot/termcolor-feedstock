{% set version = "2.0.0" %}

package:
  name: termcolor
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/t/termcolor/termcolor-{{ version }}.tar.gz
  md5: d64df8a9578e3eed8350819b3e9625da

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - hatch-vcs
    - hatchling
    - python >=3.7

  run:
    - python >=3.7

test:
  imports:
    - termcolor

about:
  home: https://pypi.org/project/termcolor/
  license: MIT
  license_file: COPYING.txt
  summary: ANSI color formatting for output in terminal

extra:
  recipe-maintainers:
    - jakirkham
    - ocefpaf
    - k-dominik
